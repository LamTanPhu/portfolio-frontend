version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base images in the Dockerfile (node) and docker-compose.yml (caddy).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base images in jenkins/Dockerfile (Jenkins LTS and the Node copy-source).
  - package-ecosystem: "docker"
    directory: "/jenkins"
    schedule:
      interval: "weekly"