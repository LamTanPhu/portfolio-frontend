name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Pages prerender against the API at build time. Until a real backend
      # is deployed, a tiny stub on :3001 answers every request with `[]` so
      # the build can complete. Production builds (Vercel) don't use this.
      # Once NEXT_PUBLIC_API_URL is set under Settings > Secrets and
      # variables > Actions > Variables, the stub is skipped.
      - name: Start stub API
        if: ${{ vars.NEXT_PUBLIC_API_URL == '' }}
        run: |
          node -e "require('http').createServer((q,r)=>{r.writeHead(200,{'Content-Type':'application/json'});r.end('[]')}).listen(3001)" &
          sleep 1
          curl -sf http://localhost:3001/api/projects

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
