name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: unit + component tests. No backend, browser or build needed.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit + component tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Pages prerender against the API at build time. Until a real backend is
      # deployed (NEXT_PUBLIC_API_URL unset), build against the fixture-backed
      # mock API in e2e/mock-api so the build exercises real-shaped data.
      # Production builds (Vercel) never use the mock.
      # Once you set these under Settings > Secrets and variables > Actions >
      # Variables (variables, not secrets: NEXT_PUBLIC_* ships in the bundle),
      # the second step takes over automatically.
      - name: Build (mock API)
        if: ${{ vars.NEXT_PUBLIC_API_URL == '' }}
        run: node e2e/with-mock-api.mjs npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Build (real API)
        if: ${{ vars.NEXT_PUBLIC_API_URL != '' }}
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

  # Real browser, production build, mock API. Needs outbound internet for the
  # Cloudflare Turnstile script and Google Fonts, like any real visit would.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Performance budgets. Assertions are warnings (see lighthouserc.json) so a
  # noisy shared runner can't block merges; scores show up in the job log.
  lighthouse:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lighthouse CI
        run: npm run lighthouse

  # Keeps the Docker backup path from rotting: builds the production image and
  # boots it. The mock API stands in for the backend (the build prerenders
  # against it), reached via --network=host so `localhost` means this runner.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Start mock API
        run: |
          node e2e/mock-api/server.mjs &
          for i in $(seq 1 30); do curl -sf http://localhost:3001/__health && break; sleep 1; done

      - name: Build image
        run: docker build --network=host --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001/api -t portfolio-frontend .

      # Same restrictions as docker-compose.yml: read-only filesystem, no capabilities,
      # writable tmpfs only where Next regenerates pages. If the app ever needs to
      # write somewhere else, this step fails instead of production.
      - name: Run image (hardened) and smoke test
        run: |
          docker run -d --name web --network host \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --tmpfs /app/.next/cache:rw,noexec,nosuid,uid=1001,gid=1001,size=32m \
            --tmpfs /app/.next/server/route-cache:rw,noexec,nosuid,uid=1001,gid=1001,size=32m \
            portfolio-frontend
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:3000/projects | grep -q portfolio-site
          curl -sf http://localhost:3000/sitemap.xml > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/no-such-page)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/projects/no-such-project)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/blog/no-such-post)" = 404
          headers=$(curl -sI http://localhost:3000/)
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-frame-options: DENY'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          ! echo "$headers" | grep -qi '^x-powered-by:'
          test "$(docker exec web id -u)" = 1001   # runs as the unprivileged user
          for i in $(seq 1 12); do
            status=$(docker inspect -f '{{.State.Health.Status}}' web)
            [ "$status" = healthy ] && break
            sleep 5
          done
          echo "container health: $status"
          test "$status" = healthy

      # Report-only for now (continue-on-error): flags fixable HIGH/CRITICAL
      # vulnerabilities in the final image. Remove continue-on-error to make it blocking.
      - name: Scan image for vulnerabilities
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 portfolio-frontend

      - name: Container logs
        if: ${{ always() }}
        run: docker logs web || true
